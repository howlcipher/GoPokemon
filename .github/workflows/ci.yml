name: CI

on:
  push:
    branches: [ gh-pages, master ]
  pull_request:
    branches: [ gh-pages, master ]

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run SEO verification
        run: python3 scripts/test_seo.py
